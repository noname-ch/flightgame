<script>window.FG = { data: {} };</script>
<script src="../js/data/looks.js"></script>
<script src="../js/data/models.js"></script>
<script src="../js/data/liveries.js"></script>

</head><body><p id="status">…</p>
<script type="module">
// One-off comparison renders (not part of the game): each type as the Rust self-test shoots it (FLIGHTGAME_SELFTEST_PLANES):
// rear quarter and side parked (gear down), and climbing (gear up, flaps 5°), the camera as the Rust chase camera.
import * as THREE from 'three';
import { loadModel, modelSize } from '../js/models3d.js';
import { setGear } from '../js/gear3d.js';
const q = new URLSearchParams(location.search);
const types = (q.get('types') || 'A320').split(',');
const W = 1020, H = 740;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.setClearColor(0x9cc3e6);
const CAMS = [['rear', 35, 8, 0.9, 1, 0], ['side', 90, 4, 1.1, 1, 0], ['air', 100, 6, 1.2, 0, 5]];
async function shot(type, [name, yaw, pitch, dist, gear, flap]) {
  const scene0 = await loadModel(type);
  const model = scene0.clone();
  const size = modelSize(type);
  model.scale.set(size.wide, size.len, size.wide);
  const copies = new Map();
  model.traverse((o) => {
    if (!o.isMesh || !o.material.userData.livFlex) return;
    if (!copies.has(o.material)) { const m = o.material.clone(); m.onBeforeCompile = o.material.onBeforeCompile; m.customProgramCacheKey = o.material.customProgramCacheKey; copies.set(o.material, m); }
    o.material = copies.get(o.material);
  });
  for (const m of copies.values()) { m.userData.livFlap.value = flap * Math.PI / 180; m.userData.livFlex.value = gear ? -0.012 * 0.6 : 0.03; }
  const g = model.getObjectByName('gear');
  if (g) setGear(g, gear);
  const scene = new THREE.Scene();
  scene.add(model);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x3a4250, 2.2));
  const key = new THREE.DirectionalLight(0xfff4dc, 2.4); key.position.set(-0.6, 0.8, 1.5);
  scene.add(key);
  const len = FG.data.looks[type].len;
  const rel = (180 + yaw) * Math.PI / 180, el = pitch * Math.PI / 180, r = len * dist;
  const cam = new THREE.PerspectiveCamera(50, W / H, 0.5, 5000);
  cam.up.set(0, 0, 1);
  cam.position.set(Math.sin(rel) * Math.cos(el) * r, Math.cos(rel) * Math.cos(el) * r, Math.sin(el) * r);
  cam.lookAt(0, 0, 0);
  renderer.render(scene, cam);
  const url = renderer.domElement.toDataURL('image/png');
  await fetch(`http://127.0.0.1:8799/map?key=b-${type.toLowerCase()}-${name}`, { method: 'POST', body: url });
}
(async () => {
  for (const t of types) for (const c of CAMS) { try { await shot(t, c); } catch (e) { console.error(t, e); } }
  document.title = 'exported';
})();
</script></body></html>
