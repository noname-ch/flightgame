<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Flightgame</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Playfair+Display:wght@700;900&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.13.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    {
      "imports": {
        "maplibre-gl": "https://cdn.jsdelivr.net/npm/maplibre-gl@6.13.0/dist/maplibre-gl.mjs",
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header>
    <div class="brand">✈ <span id="company"></span> <span id="mode-badge"></span></div>
    <div id="money"></div>
    <div id="clock"></div>
    <div class="speed">
      <button id="pause" title="Pause (Space)">⏸</button>
      <input id="speed" type="range" min="0" max="1000" value="0" title="Game speed (← / →)">
      <span id="speed-label" title="Click: back to real time"></span>
    </div>
    <button id="view3d-toggle" title="3D view (V)">3D</button>
    <div class="spacer"></div>
    <button id="devtools-toggle" title="Developer tools (F2)">🛠</button>
    <button id="save">Save</button>
    <button id="newgame">New game</button>
  </header>

  <main>
    <div id="map"><div id="view3d" hidden></div></div>
    <aside id="sidebar">
      <div id="details"></div>
      <div id="events"></div>
      <nav class="tabs">
        <button data-tab="fleet">Fleet</button>
        <button data-tab="market">Market</button>
        <button data-tab="slots">Slots</button>
        <button data-tab="airports">Airports</button>
        <button data-tab="finance">Finance</button>
        <button data-tab="log">Log</button>
      </nav>
      <div id="tab-content"></div>
    </aside>
    <div id="market" hidden></div>
  </main>

  <div id="devtools" hidden></div>
  <div id="newspaper" hidden></div>
  <div id="start-screen"></div>

  <div id="gameover" hidden>Bankrupt! Press "New game" to try again.</div>
  <div id="toast"></div>

  <div id="chart-tip" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data/aircraft.js"></script>
  <script src="js/data/airports.js"></script>
  <script src="js/data/airports-more.js"></script>
  <script src="js/data/runways.js"></script>
  <script src="js/data/towns.js"></script>
  <script src="js/data/cities.js"></script>
  <script src="js/data/factories.js"></script>
  <script src="js/data/looks.js"></script>
  <script src="js/data/models.js"></script>
  <script src="js/data/events.js"></script>
  <script src="js/game.js"></script>
  <script src="js/hangar.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/devtools.js"></script>
  <script>
    // The 3D view is an ES module with imports from the internet. If it fails to load (offline, a
    // blocked CDN, or old cached files mixed with new ones), say so instead of leaving a dead button.
    (function () {
      let why = '';
      window.addEventListener('error', (e) => {
        const src = e.filename || (e.target && e.target.src) || '';
        if (/view3d|models3d|livery|maplibre|three/.test(src)) why = e.message || `could not load ${src}`;
      }, true);
      document.getElementById('view3d-toggle').addEventListener('click', () => setTimeout(() => {
        if (window.FG && FG.view3d) return;
        const t = document.getElementById('toast');
        t.textContent = location.protocol === 'file:'
          // Browsers never load ES modules from file:// pages.
          ? '3D needs the game served over http: open https://noname-ch.github.io/flightgame/ or run ./play.sh.'
          : `3D view not loaded${why ? `: ${why}` : ' yet'}. Reload with Ctrl+Shift+R (needs internet).`;
        t.className = 'show bad';
        clearTimeout(t.devTimer);
        t.devTimer = setTimeout(() => { t.className = ''; }, 6000);
      }));
    })();
  </script>
  <script type="module" src="js/view3d.js"></script>
  <script type="module" src="js/hangar3d.js"></script>
  <script type="module" src="js/icons3d.js"></script>
</body>
</html>
