<body>
  <div id="loading" role="status" aria-live="polite">
    <div class="ld-card">
      <div class="ld-sky" aria-hidden="true"><span class="ld-plane">✈</span></div>
      <h1>Flightgame</h1>
      <div class="ld-track"><i id="ld-bar"></i></div>
      <p id="ld-text">Loading the world – 16,000 airports and 32,000 cities…</p>
    </div>
  </div>
  <script>
    // Never leave the loading screen up for good: when one of the game's own files fails to load or throws
    // while it is shown, or it has been up for 30 s, say so and offer a reload.
    (function () {
      const el = document.getElementById('loading');
      const shown = () => !el.hidden && !el.classList.contains('done');
      function fail(msg) {
        if (!shown() || el.querySelector('.ld-fail')) return;
        const box = document.createElement('div');
        box.className = 'ld-fail';
        box.innerHTML = '<p></p><button type="button">Reload</button>';
        box.querySelector('p').textContent = msg;
        box.querySelector('button').onclick = () => location.reload();
        el.querySelector('.ld-card').appendChild(box);
      }
      window.addEventListener('error', (e) => {
        const t = e.target;
        let src = e.filename || '';
        if (t && t !== window) { // a file that didn't load: only scripts count (map tiles and pictures fail all the time)
          if (t.tagName !== 'SCRIPT' || t.type === 'module') return;
          src = t.src;
        } else if (!src.startsWith(location.origin) && location.protocol !== 'file:') return;
        if (/view3d|models3d|livery|hangar3d|icons3d|shots3d|osmairports/.test(src)) return; // (3D: optional)
        fail(`The game could not start: ${t && t !== window ? `${src.split('/').pop().split('?')[0]} did not load` : e.message}. ` +
          'Reload the page (Ctrl+Shift+R).');
      }, true);
      let since = Date.now();
      let was = true;
      setInterval(() => {
        const now = shown();
        if (now && !was) { since = Date.now(); el.querySelectorAll('.ld-fail').forEach((x) => x.remove()); }
        was = now;
        if (now && Date.now() - since > 30000) fail('This takes much longer than it should. Check your internet connection and reload.');
      }, 1000);
    })();
  </script>

  <script>
    // The 3D view is an ES module with imports from the internet. If it fails to load (offline, a
    // blocked CDN, or old cached files mixed with new ones), say so instead of leaving a dead button.
    (function () {
      let why = '';
      window.addEventListener('error', (e) => {
        const src = e.filename || (e.target && e.target.src) || '';
        if (/view3d|models3d|livery|maplibre|three/.test(src)) why = e.message || `could not load ${src}`;
      }, true);
      document.getElementById('view3d-toggle').addEventListener('click', () => setTimeout(() => {
        if (window.FG && FG.view3d) return;
        const t = document.getElementById('toast');
        t.textContent = location.protocol === 'file:'
          // Browsers never load ES modules from file:// pages.
          ? '3D needs the game served over http: open https://noname-ch.github.io/flightgame/ or run ./play.sh.'
          : `3D view not loaded${why ? `: ${why}` : ' yet'}. Reload with Ctrl+Shift+R (needs internet).`;
        t.className = 'show bad';
        clearTimeout(t.devTimer);
        t.devTimer = setTimeout(() => { t.className = ''; }, 6000);
      }));
    })();
  </script>
